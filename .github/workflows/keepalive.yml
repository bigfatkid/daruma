# Hält das kostenlose Supabase-Projekt wach: Supabase pausiert Gratis-Projekte nach 7 Tagen ohne Zugriff.
# Läuft alle 3 Tage und fragt die kleine Funktion public.ping() ab (liest keine Daten).
# Der Schlüssel ist der öffentliche „publishable key“, der auch in der App steht.
name: Supabase wach halten
on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/keepalive.yml']
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping an Supabase
        env:
          SB_URL: https://exzvyipaoeqymohagwuc.supabase.co
          SB_KEY: sb_publishable_bs1sy66zB5bUXn4LN2w_8g_rllMcIIJ
        run: |
          for i in 1 2 3; do
            out=$(curl -sS -m 30 -X POST "$SB_URL/rest/v1/rpc/ping" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}' || true)
            echo "Antwort: $out"
            if [ "$out" = '"ok"' ]; then exit 0; fi
            sleep 20
          done
          echo "Supabase hat nicht geantwortet (pausiert? Tabelle/Funktion fehlt?)"
          exit 1
