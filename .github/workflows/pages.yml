# Veröffentlicht die Web-App (Ordner web) bei jedem Push auf main über GitHub Pages.
name: Web-App veröffentlichen
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # GitHub listet das hochgeladene Paket manchmal erst nach ein paar Sekunden.
      # Ohne die Pause scheitert deploy-pages mit „No artifacts named github-pages“.
      - name: Kurz warten
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
