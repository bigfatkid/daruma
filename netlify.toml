# Netlify veröffentlicht den Ordner "web" (die Web-App). Kein Build-Schritt nötig.
[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Nur eigene Skripte erlauben (keine fremden/eingefügten Inline-Skripte).
    # Nebeneffekt laut Netlify-Doku: das "Powered by Netlify"-Badge wird nicht angezeigt.
    Content-Security-Policy = "script-src 'self'; object-src 'none'; base-uri 'self'"
